name: Verify

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Use Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install project and verification dependencies
        run: |
          python -m pip install --upgrade 'pip>=26.1.2'
          python -m pip install -e '.[dev]'
      - name: Lint
        run: ruff check .
      - name: Type-check source and tests
        run: mypy src tests scripts
      - name: Run branch-aware test suite
        run: pytest --cov=finreplay --cov-report=term-missing
      - name: Verify installable user catalogs
        run: python scripts/build_user_catalogs.py --check
      - name: Verify public scenario downloads
        run: python scripts/build_public_replaypack_downloads.py --check
      - name: Verify public claim registry
        run: python scripts/build_public_claim_registry.py --check
      - name: Verify counted scenario catalog
        run: python scripts/verify_scenario_catalog.py
      - name: Validate independent-review record catalog
        run: python scripts/validate_independent_review_records.py
      - name: Verify committed public release receipts
        run: |
          python scripts/verify_public_site_readiness.py
          python scripts/verify_public_site_deployment.py
          python scripts/verify_public_github_release.py
      - name: Scan tracked text for credential and privacy findings
        run: python scripts/scan_tracked_secrets.py
      - name: Audit complete resolved environment
        if: matrix.python-version == '3.12'
        run: pip-audit --local

  package-smoke:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Use Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Build and validate distributions
        run: |
          python -m pip install --upgrade 'pip>=26.1.2' 'build>=1.2,<2' 'twine>=6,<7'
          python -m build
          python -m twine check dist/*
      - name: Verify wheel in a fresh environment
        run: |
          python -m venv /tmp/finreplay-wheel
          /tmp/finreplay-wheel/bin/pip install dist/*.whl
          /tmp/finreplay-wheel/bin/finreplay adapter validate
          /tmp/finreplay-wheel/bin/finreplay capability list
          /tmp/finreplay-wheel/bin/finreplay scenario explain svb-2023
          /tmp/finreplay-wheel/bin/finreplay scenario verify svb-2023

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Use Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.13.0"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install locked web dependencies
        run: npm ci --prefix web
      - name: Lint public evidence site
        run: npm run lint --prefix web
      - name: Build and test rendered evidence routes
        run: npm test --prefix web
      - name: Audit complete resolved web environment
        run: npm audit --prefix web

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
