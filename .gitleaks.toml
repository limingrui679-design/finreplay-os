[extend]
useDefault = true

[[rules]]
id = "generic-api-key"

  [[rules.allowlists]]
  description = "CFTC evidence locks store public response digests, not API credentials"
  condition = "AND"
  regexTarget = "line"
  regexes = ['''^\s*"api_response_sha256":\s*"[a-f0-9]{64}",?\s*$''']
  paths = ['''^src/finreplay/resources/scenarios/cftc-tff-2026/input-lock\.json$''']
